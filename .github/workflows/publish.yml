name: Publish

# Started by hand only. It asks for a version such as 1.0 or 1.1, builds the web interface and
# publishes the program with Native AOT (dotnet publish -c Release) for Linux x64 and arm64, and
# makes a GitHub release with one archive per architecture:
#
#   my_backup_linux_<version>_x64.tar.gz
#   my_backup_linux_<version>_arm64.tar.gz
#
# No cache is used (no cache: in setup-node, none in setup-dotnet, no actions/cache): every build starts clean.
# The archives kept as workflow artifacts are kept for 1 day, the shortest time there is.
#
# Everything runs on ubuntu-latest, which is x64. The arm64 program is cross-compiled there, in the cross-compilation
# image of the .NET build; no arm runner is used.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0 or 1.1 (the tag will be v1.0)"
        required: true
        type: string
      dry_run:
        description: "Build and keep the archives as workflow artifacts (for one day), but make no release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - name: The version is numbers and dots, and has no release yet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::The version must be like 1.0, 1.1 or 1.0.1, not '$VERSION'."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The release v$VERSION exists already."
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::The tag v$VERSION exists already."
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
          - arch: arm64
            rid: linux-arm64
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: src/web/package.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      # The x64 program is made on the machine, which has what Native AOT needs; this only makes sure.
      - name: Tools for Native AOT on x64
        if: matrix.arch == 'x64'
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Build the web interface
        working-directory: src/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build   # writes into src/Backup.Server/wwwroot

      - name: Publish with Native AOT (x64)
        if: matrix.arch == 'x64'
        run: dotnet publish src/Backup.Server -c Release -r "$RID" -p:Version="$VERSION" -o publish

      # The arm64 program is cross-compiled in the image that the .NET build itself uses for this: it has the arm64
      # libraries (/crossrootfs/arm64), clang and lld. That avoids installing arm64 packages next to the amd64 ones of the
      # machine with apt, which cannot be done when the versions of the two architectures differ. The SDK of the machine is
      # mounted into the image; the program is linked against old enough libraries to run on most Linux distributions.
      - name: Publish with Native AOT (arm64, cross-compiled)
        if: matrix.arch == 'arm64'
        env:
          IMAGE: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64
        run: |
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/nuget"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -v "$dotnet_root":/dotnet:ro \
            -v "$RUNNER_TEMP/home":/home/build -v "$RUNNER_TEMP/nuget":/nuget \
            -e HOME=/home/build -e DOTNET_ROOT=/dotnet -e PATH=/dotnet:/usr/local/bin:/usr/bin:/bin -e NUGET_PACKAGES=/nuget \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 -e DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            "$IMAGE" \
            dotnet publish src/Backup.Server -c Release -r linux-arm64 -p:Version="$VERSION" \
              -p:CppCompilerAndLinker=clang -p:SysRoot=/crossrootfs/arm64 -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy \
              -o publish

      - name: Make the archive
        run: |
          name="my_backup_linux_${VERSION}_${ARCH}"
          rm -f publish/*.dbg publish/*.pdb
          mkdir -p stage/my-backup
          cp -r publish/. stage/my-backup/
          cp README.md my-backup.service stage/my-backup/
          # my-backup/ is what is unpacked into /opt, where my-backup.service expects the program.
          tar -czf "${name}.tar.gz" -C stage my-backup
          ls -l "${name}.tar.gz"
          tar -tzf "${name}.tar.gz" | head -20
          file stage/my-backup/backup-manager

      - uses: actions/upload-artifact@v4
        with:
          name: my_backup_linux_${{ inputs.version }}_${{ matrix.arch }}
          path: my_backup_linux_${{ inputs.version }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Make the release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Create the release v${{ inputs.version }}
        run: |
          ls -l archives
          gh release create "v$VERSION" archives/my_backup_linux_"$VERSION"_*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
